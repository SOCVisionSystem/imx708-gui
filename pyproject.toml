[project]
name = "imx708-gui"
version = "0.1.0"
description = "Cross-platform GUI client for Sony IMX708 camera sensor"
authors = [
    { name = "Sandesh", email = "sandesh@soccentric.com" },
]
license = { text = "GPL-2.0-only" }
readme = "README.md"
requires-python = ">=3.8"

# Keep these in step with requirements.txt. grpcio-tools generates code that
# requires a matching protobuf runtime, so the upper bounds are load-bearing:
# unpinned installs produced "cannot import name 'runtime_version'" at start-up.
dependencies = [
    "PySide6>=6.5,<7",
    "grpcio>=1.60,<2",
    "grpcio-tools>=1.60,<2",
    "protobuf>=4.25,<6",
]

[project.scripts]
imx708-cam = "imx708_client:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

# imx708_client is a single module, not a package. "packages.find" only ever
# discovers directories containing __init__.py, so the previous configuration
# installed nothing at all and the imx708-cam entry point failed on import.
[tool.setuptools]
py-modules = ["imx708_client"]

[tool.setuptools.packages.find]
include = ["imx708_proto*"]

[tool.setuptools.package-data]
imx708_proto = ["*.py"]
